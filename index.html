<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis — built in ChatGPT, zero Codex</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010309;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.title{position:fixed;z-index:2;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:94vw;text-align:center;font-size:clamp(12px,1.1vw,18px);font-weight:300;letter-spacing:.12em;color:#fff;opacity:0;pointer-events:none;text-shadow:0 1px 22px rgba(255,255,255,.22);animation:titleIn 1s ease 2.05s forwards}
.meta{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));max-width:min(82vw,820px);pointer-events:none;text-shadow:0 2px 16px #000;opacity:0;animation:titleIn 1s ease 2.35s forwards}
.msg{font-size:clamp(11px,.9vw,14px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-top:5px;font-size:clamp(9px,.72vw,11px);opacity:.52}
.tip{position:fixed;z-index:4;max-width:min(360px,76vw);padding:9px 11px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(4,8,16,.82);box-shadow:0 8px 30px rgba(0,0,0,.42),0 0 32px rgba(175,210,255,.1);backdrop-filter:blur(10px);font-size:11px;line-height:1.45;white-space:pre-wrap;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease}.tip.show{opacity:1;transform:translateY(0)}
@keyframes titleIn{to{opacity:.9}}@media(max-width:640px){.title{letter-spacing:.055em}.tip{font-size:10px}}
@media(prefers-reduced-motion:reduce){.title,.meta{animation:none;opacity:.9}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">Genesis — built in ChatGPT, zero Codex</div>
<div class="meta"><div class="msg" id="m">Mapping public GitHub history…</div><div class="time" id="t"></div></div>
<div class="tip" id="tip"></div>
<script>
(()=>{"use strict";
const USER="blessing1031r-dotcom",SELF="astra-no-codex";
const REPOS=`https://api.github.com/users/${USER}/repos?per_page=100&type=owner&sort=updated`;
const POLL=75000,CACHE_TTL=600000,CACHE_KEY="genesis-public-history-v4",ETAG_KEY="genesis-self-etag-v4";
const TAU=Math.PI*2,N=7600,CORE=560,FAR=1100,MAX_PAGES=50,INTRO_MS=2900;
const c=document.getElementById("c"),m=document.getElementById("m"),tm=document.getElementById("t"),tip=document.getElementById("tip");
let W=1,H=1,S=1,D=1,commits=[],stars=[],known=new Set,repoCount=0,selfEtag=localStorage.getItem(ETAG_KEY)||null,truncated=false,ignite=new Map,start=performance.now(),pollTimer=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd=mulberry32(0xA57A2026),decor=makeDecor(),coreStars=makeCore(),far=makeFar();
let R=webgl()||canvas2d();
resize(); addEventListener("resize",resize,{passive:true});
c.addEventListener("pointerup",e=>{const h=hit(e.clientX,e.clientY);if(h)window.open(h.url,"_blank","noopener")},{passive:true});
c.addEventListener("pointermove",e=>{const h=hit(e.clientX,e.clientY);c.style.cursor=h?"pointer":"default";h?showTip(h,e.clientX,e.clientY):hideTip()},{passive:true});
c.addEventListener("pointerleave",hideTip,{passive:true});
boot();requestAnimationFrame(loop);
function loop(n){R.draw(n);requestAnimationFrame(loop)}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;S=Math.min(W,H);D=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(W*D));c.height=Math.max(1,Math.round(H*D));R.resize()}
function intro(n=performance.now()){return reduce?1:Math.max(0,Math.min(1,(n-start)/INTRO_MS))}
function ease(x){return 1-Math.pow(1-x,4)}

async function boot(){const z=cacheRead();if(z){commits=z.commits||[];repoCount=z.repoCount||0;truncated=!!z.truncated;paintData();await pollSelf()}else await loadAll();if(!pollTimer)pollTimer=setInterval(pollSelf,POLL)}
async function loadAll(){try{m.textContent="Mapping public GitHub history…";const rr=await fetch(REPOS,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!rr.ok)throw Error(`repositories ${rr.status}`);const repos=(await rr.json()).filter(x=>!x.private);repoCount=repos.length;let all=[];for(let i=0;i<repos.length;i++){tm.textContent=`Scanning ${i+1}/${repos.length} public repositories`;all.push(...await fetchRepoHistory(repos[i].name));if(truncated)break}commits=uniq(all).sort(byDate);paintData();cacheWrite()}catch(e){console.warn(e);if(!commits.length){m.textContent="Public history unavailable — retrying";tm.textContent="GitHub API may be rate-limited"}}}
async function fetchRepoHistory(name){const out=[];for(let page=1;page<=MAX_PAGES;page++){const u=`https://api.github.com/repos/${USER}/${encodeURIComponent(name)}/commits?author=${encodeURIComponent(USER)}&per_page=100&page=${page}`;let r;try{r=await fetch(u,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"})}catch(e){console.warn(name,e);break}if(name===SELF&&page===1){selfEtag=r.headers.get("ETag")||selfEtag;if(selfEtag)localStorage.setItem(ETAG_KEY,selfEtag)}if(r.status===409)break;if(r.status===403){truncated=true;break}if(!r.ok)break;const a=await r.json();out.push(...a.map(x=>norm(x,name)));if(a.length<100)break;const rem=Number(r.headers.get("X-RateLimit-Remaining"));if(Number.isFinite(rem)&&rem<4){truncated=true;break}}return out}
async function pollSelf(){try{const h={Accept:"application/vnd.github+json"};if(selfEtag)h["If-None-Match"]=selfEtag;const u=`https://api.github.com/repos/${USER}/${SELF}/commits?author=${encodeURIComponent(USER)}&per_page=100`;const r=await fetch(u,{headers:h,cache:"no-store"});if(r.status===304||!r.ok)return;selfEtag=r.headers.get("ETag")||selfEtag;if(selfEtag)localStorage.setItem(ETAG_KEY,selfEtag);const a=(await r.json()).map(x=>norm(x,SELF)),now=performance.now()/1000;let changed=false;for(const x of a){const k=key(x);if(!known.has(k)){ignite.set(k,now);commits.push(x);changed=true}}if(changed){commits=uniq(commits).sort(byDate);paintData();cacheWrite()}}catch(e){console.warn(e)}}
function norm(x,repo){return{sha:x.sha,url:x.html_url,repo,message:(x.commit&&x.commit.message?x.commit.message:"Untitled commit").split("\n")[0],date:x.commit&&x.commit.author?x.commit.author.date:null}}
function key(x){return`${x.repo}:${x.sha}`}function uniq(a){const z=new Map;for(const x of a)z.set(key(x),x);return[...z.values()]}
function byDate(a,b){return new Date(b.date||0)-new Date(a.date||0)}
function paintData(){known=new Set(commits.map(key));latest();rebuild();R.rebuild()}
function latest(){if(!commits.length){m.textContent="No public commits found";tm.textContent="";return}const x=commits[0];m.textContent=x.message;tm.textContent=`${x.repo} · ${fmt(x.date)} · ${commits.length}${truncated?"+":""} commits across ${repoCount} public repos`}

function sixPath(q,arm,jA=0,jR=0){
  if(arm===0){
    if(q<.34){
      const u=q/.34,e=u*u*(3-2*u);
      let x=.205-.43*e+.06*Math.sin(Math.PI*u),y=.49-.41*e;
      const dx=-.43+.06*Math.PI*Math.cos(Math.PI*u),dy=-.41,n=Math.hypot(dx,dy)||1;
      x+=(-dy/n)*jR;y+=(dx/n)*jR;return[x,y];
    }
    const u=(q-.34)/.66,th=2.42+u*TAU,rx=.315,ry=.275,cx=.005,cy=-.105,wob=1+jA*.65;
    return[cx+rx*wob*Math.cos(th)+jR*Math.cos(th),cy+ry*wob*Math.sin(th)+jR*Math.sin(th)];
  }
  const u=q,th=-.62+u*TAU*1.14,r=.055+.255*Math.pow(u,.88)+jR*.65;
  let x=.01+r*Math.cos(th),y=-.105+r*.82*Math.sin(th);
  if(u>.78){const k=(u-.78)/.22;x+=.045*k;y+=.11*k*k}
  return[x,y];
}
function startPos(seed,fx,fy){const a=hash(seed+"intro")*TAU,rad=.72+.78*hash(seed+"rad");return[Math.cos(a)*rad+fx*.12,Math.sin(a)*rad*.72+fy*.12]}
function rebuild(){
  if(!commits.length){stars=[];return}
  const ts=commits.map(x=>+new Date(x.date||0)),mx=Math.max(...ts),mn=Math.min(...ts),span=Math.max(1,mx-mn);
  stars=commits.map(x=>{let q=(mx-(+new Date(x.date||0)))/span;q=Math.pow(Math.max(0,Math.min(1,q)),.88);const arm=hash(x.sha+"arm")>.37?0:1,jR=(hash(x.sha+"r")-.5)*(.018+.032*q),jA=(hash(x.sha+"a")-.5)*.12,p=sixPath(q,arm,jA,jR),s=startPos(x.sha,p[0],p[1]),col=repoColor(x.repo);return{...x,x:p[0],y:p[1],sx:s[0],sy:s[1],size:10+8*(1-q)+6*hash(x.sha+"s"),col,spark:1.25,a:1.72,ign:ignite.get(key(x))||-1000,turn:1,gather:1}})
}
function makeDecor(){return Array.from({length:N},(_,i)=>{const arm=rnd()<.66?0:1,q=Math.pow(rnd(),1.38),jR=gauss()*(.011+.052*q),jA=gauss()*.055,p=sixPath(q,arm,jA,jR),s=startPos(`d${i}`,p[0],p[1]),b=Math.pow(rnd(),3.45),z=rnd(),col=z<.16?[1,.73,.55]:z<.41?[.70,.88,1]:[1,1,1],cl=.68+.32*Math.pow(.5+.5*Math.sin(q*34+arm*2.1),3);return{x:p[0],y:p[1],sx:s[0],sy:s[1],size:.72+rnd()*1.45+b*10.5,col,spark:b>.5?Math.min(1.35,(b-.5)*2.9):0,a:(.34+1.28*b+rnd()*.34)*(1-.22*q)*cl,ign:-1000,turn:1,gather:1}})}
function makeCore(){return Array.from({length:CORE},(_,i)=>{const r=Math.pow(rnd(),2.15)*.104,a=rnd()*TAU,b=Math.pow(rnd(),2.6),z=rnd(),col=z<.13?[1,.79,.62]:z<.4?[.72,.9,1]:[1,1,1],x=r*Math.cos(a),y=-.105+r*.84*Math.sin(a),s=startPos(`c${i}`,x,y);return{x,y,sx:s[0],sy:s[1],size:.72+rnd()*1.7+b*8.4,col,spark:b>.58?Math.min(1.2,(b-.58)*3):0,a:.48+1.42*b,ign:-1000,turn:1,gather:1}})}
function makeFar(){return Array.from({length:FAR},()=>{const x=(rnd()-.5)*1.9,y=(rnd()-.5)*1.25;return{x,y,sx:x,sy:y,size:.45+rnd()*1.25+Math.pow(rnd(),7)*3.1,col:rnd()<.2?[.68,.83,1]:[1,1,1],spark:0,a:.08+rnd()*.34,ign:-1000,turn:0,gather:0}})}
function repoColor(name){const z=hash(name+"repo");return z<.27?[1,.76,.57]:z<.6?[.69,.88,1]:[1,1,1]}
function showTip(h,x,y){tip.textContent=`${h.repo}\n${h.message}\n${fmt(h.date)}`;tip.style.left=`${Math.min(W-260,Math.max(10,x+16))}px`;tip.style.top=`${Math.min(H-90,Math.max(10,y+16))}px`;tip.classList.add("show")}
function hideTip(){tip.classList.remove("show")}function fmt(d){if(!d)return"Unknown time";return new Date(d).toLocaleString(undefined,{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function cacheRead(){try{const z=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return z&&Date.now()-z.at<CACHE_TTL&&Array.isArray(z.commits)?z:null}catch{return null}}
function cacheWrite(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),repoCount,truncated,commits}))}catch{}}

function webgl(){
 const g=c.getContext("webgl2",{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:"high-performance"});if(!g)return null;
 const vs=`#version 300 es
 precision highp float;
 layout(location=0)in vec2 p;layout(location=1)in vec2 p0;layout(location=2)in float z;layout(location=3)in vec3 col;layout(location=4)in float sp;layout(location=5)in float al;layout(location=6)in float ign;layout(location=7)in float turn;layout(location=8)in float gather;
 uniform vec2 scale;uniform float rot,dpr,now,intro;
 out vec3 C;out float S,A,F;
 mat2 R(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}void main(){
 float e=1.-pow(1.-intro,4.);vec2 q=mix(p0,p,e*gather+(1.-gather));q=R((1.-e)*2.8*gather)*q;
 q=mix(q,R(rot)*q,turn);gl_Position=vec4(q*scale,0,1);
 float k=.72+.28*e,f=0.,age=now-ign;if(ign>0.&&age>=0.&&age<.8){float x=age/.8,b=sin(3.14159*pow(x,.58));k+=3.5*b*(1.-.28*x);f=(1.-x)*b;}
 float arrive=1.+2.1*exp(-pow((intro-.82)/.085,2.))*gather;gl_PointSize=max(1.,z*dpr*k*arrive);C=col;S=sp;A=al*(.28+.72*e*gather+(1.-gather));F=f;}`;
 const fs=`#version 300 es
 precision highp float;in vec3 C;in float S,A,F;out vec4 O;void main(){vec2 p=gl_PointCoord*2.-1.;float r=dot(p,p),core=exp(-r*11.),halo=exp(-r*1.85)*.58,x=(exp(-abs(p.x)*30.)*exp(-abs(p.y)*1.55)+exp(-abs(p.y)*30.)*exp(-abs(p.x)*1.55))*S*1.18,v=(core+halo+x)*A*(1.+F*2.6);if(v<.009)discard;O=vec4(C*v,v);}`;
 const bvs=`#version 300 es
 precision highp float;const vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));void main(){gl_Position=vec4(P[gl_VertexID],0,1);}`;
 const bfs=`#version 300 es
 precision highp float;uniform vec2 res;uniform float rot,intro;out vec4 O;
 float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}float fb(vec2 p){float v=0.,a=.55;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+17.1;a*=.48;}return v;}
 void main(){vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);float r=length(p),a=atan(p.y,p.x)-rot*.65,no=fb(p*6.2+9.);float arm=pow(.5+.5*cos(2.*a-6.0*log(r+.045)),11.),fade=(1.-smoothstep(.025,.68,r))*exp(-r*2.1);float e=smoothstep(.22,.98,intro),flash=exp(-pow((intro-.84)/.075,2.));vec3 col=vec3(.0016,.004,.01)+vec3(.022,.048,.09)*arm*fade*(.2+1.25*no)*e+vec3(.004,.008,.018)*no*.2;col+=vec3(1.,.986,.95)*exp(-r*r*620.)*(.72+1.15*e+1.35*flash)+vec3(.43,.66,1.)*exp(-r*r*88.)*(.08+.2*e);O=vec4(col,1);}`;
 const prog=(v,f)=>{const sh=(ty,s)=>{const x=g.createShader(ty);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(x));return x},p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,v));g.attachShader(p,sh(g.FRAGMENT_SHADER,f));g.linkProgram(p);if(!g.getProgramParameter(p,g.LINK_STATUS))throw Error(g.getProgramInfoLog(p));return p};
 const P=prog(vs,fs),B=prog(bvs,bfs),buf=g.createBuffer(),vao=g.createVertexArray();g.bindVertexArray(vao);g.bindBuffer(g.ARRAY_BUFFER,buf);const stride=13*4;
 for(const [i,n,o]of[[0,2,0],[1,2,2],[2,1,4],[3,3,5],[4,1,8],[5,1,9],[6,1,10],[7,1,11],[8,1,12]]){g.enableVertexAttribArray(i);g.vertexAttribPointer(i,n,g.FLOAT,false,stride,o*4)}
 let count=0;function reb(){const all=[...far,...decor,...coreStars,...stars],d=new Float32Array(all.length*13);let o=0;for(const x of all){d[o++]=x.x;d[o++]=x.y;d[o++]=x.sx;d[o++]=x.sy;d[o++]=x.size;d[o++]=x.col[0];d[o++]=x.col[1];d[o++]=x.col[2];d[o++]=x.spark;d[o++]=x.a;d[o++]=x.ign;d[o++]=x.turn;d[o++]=x.gather}count=all.length;g.bindBuffer(g.ARRAY_BUFFER,buf);g.bufferData(g.ARRAY_BUFFER,d,g.DYNAMIC_DRAW)}reb();
 return{resize(){g.viewport(0,0,c.width,c.height)},rebuild:reb,draw(n){const it=intro(n),wob=.035*Math.sin((n-start)/18000);g.disable(g.BLEND);g.useProgram(B);g.uniform2f(g.getUniformLocation(B,"res"),c.width,c.height);g.uniform1f(g.getUniformLocation(B,"rot"),(n-start)/90000*TAU);g.uniform1f(g.getUniformLocation(B,"intro"),it);g.drawArrays(g.TRIANGLES,0,3);g.enable(g.BLEND);g.blendFunc(g.ONE,g.ONE);g.useProgram(P);const sp=2*Math.min(c.width,c.height);g.uniform2f(g.getUniformLocation(P,"scale"),sp/c.width,sp/c.height);g.uniform1f(g.getUniformLocation(P,"rot"),wob);g.uniform1f(g.getUniformLocation(P,"dpr"),D);g.uniform1f(g.getUniformLocation(P,"now"),n/1000);g.uniform1f(g.getUniformLocation(P,"intro"),it);g.bindVertexArray(vao);g.drawArrays(g.POINTS,0,count)}}
}

function canvas2d(){
 const x=c.getContext("2d",{alpha:false});
 function dot(s,px,py,z,a){x.fillStyle=rgba(s.col,a);x.beginPath();x.arc(px,py,Math.max(.5,z*.31),0,TAU);x.fill();if(s.spark>.1){x.strokeStyle=rgba(s.col,Math.min(.9,a*.76));x.lineWidth=Math.max(.42,z*.05);const l=z*(1.55+s.spark*.95);x.beginPath();x.moveTo(px-l,py);x.lineTo(px+l,py);x.moveTo(px,py-l);x.lineTo(px,py+l);x.stroke()}}
 return{resize(){},rebuild(){},draw(n){x.setTransform(D,0,0,D,0,0);x.fillStyle="#010309";x.fillRect(0,0,W,H);const it=intro(n),e=ease(it),cx=W/2,cy=H/2,flash=Math.exp(-Math.pow((it-.84)/.075,2)),g=x.createRadialGradient(cx,cy,0,cx,cy,S*.16);g.addColorStop(0,`rgba(255,252,244,${.35+.55*e+.3*flash})`);g.addColorStop(.13,`rgba(160,205,255,${.08+.18*e})`);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation="lighter";for(const q of far)dot(q,cx+q.x*S,cy-q.y*S,q.size,q.a);const wob=.035*Math.sin((n-start)/18000),cs=Math.cos(wob),sn=Math.sin(wob);for(const q of [...decor,...coreStars,...stars]){let xx=q.sx+(q.x-q.sx)*e,yy=q.sy+(q.y-q.sy)*e;const sw=(1-e)*2.8,cs0=Math.cos(sw),sn0=Math.sin(sw),rx=cs0*xx-sn0*yy,ry=sn0*xx+cs0*yy;xx=cs*rx-sn*ry;yy=sn*rx+cs*ry;let z=q.size*(.72+.28*e)*(1+2.1*Math.exp(-Math.pow((it-.82)/.085,2)));const age=n/1000-q.ign;if(q.ign>0&&age>=0&&age<.8){const p=age/.8;z*=1+3.5*Math.sin(Math.PI*Math.pow(p,.58))*(1-.28*p)}dot(q,cx+xx*S,cy-yy*S,z,q.a*(.28+.72*e))}x.globalCompositeOperation="source-over"}}
}
function hit(X,Y){const b=c.getBoundingClientRect(),px=X-b.left,py=Y-b.top,it=intro(),e=ease(it),wob=.035*Math.sin((performance.now()-start)/18000),cs=Math.cos(wob),sn=Math.sin(wob),cx=W/2,cy=H/2;let best=null,bd=1e9;for(const q of stars){let xx=q.sx+(q.x-q.sx)*e,yy=q.sy+(q.y-q.sy)*e;const sw=(1-e)*2.8,cs0=Math.cos(sw),sn0=Math.sin(sw),rx=cs0*xx-sn0*yy,ry=sn0*xx+cs0*yy;xx=cx+(cs*rx-sn*ry)*S;yy=cy-(sn*rx+cs*ry)*S;const dx=px-xx,dy=py-yy,d=dx*dx+dy*dy,rr=Math.max(18,q.size*1.5);if(d<rr*rr&&d<bd){best=q;bd=d}}return best}
function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function rgba(q,a){return`rgba(${Math.round(q[0]*255)},${Math.round(q[1]*255)},${Math.round(q[2]*255)},${Math.max(0,Math.min(1,a))})`}
})();
</script>
</body>
